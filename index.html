<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Catu AI</title>
<style>
  :root { --bg1:#1a0b3b; --bg2:#0b0420; --accent:#a78bfa; --pink:#f472b6; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin:0; height:100%; overflow:hidden; background: radial-gradient(circle at 50% 35%, var(--bg1), var(--bg2)); font-family: system-ui, sans-serif; color:#fff; }
  #stage { position:fixed; inset:0; width:100%; height:100%; display:block; }
  #top { position:fixed; top:0; left:0; right:0; padding:calc(env(safe-area-inset-top,0px) + 10px) 14px 8px; display:flex; align-items:center; gap:10px; z-index:5; }
  #top b { font-size:18px; }
  #badge { font-size:12px; padding:3px 9px; border-radius:99px; border:1px solid var(--accent); color:var(--accent); }
  #bottom { position:fixed; left:0; right:0; bottom:0; padding:10px 12px calc(env(safe-area-inset-bottom,0px) + 12px); z-index:5;
            background: linear-gradient(to top, rgba(11,4,32,.95), rgba(11,4,32,0)); }
  .row { display:flex; gap:8px; flex-wrap:wrap; justify-content:center; margin-top:8px; }
  button { border:1px solid rgba(167,139,250,.6); background:rgba(40,20,90,.75); color:#fff; border-radius:14px; padding:10px 14px; font-size:14px; }
  button:active { transform:scale(.96); }
  .big { font-size:17px; padding:13px 22px; background:linear-gradient(135deg,#7c3aed,#db2777); border:none; font-weight:600; }
  .chips button { font-size:12px; padding:7px 10px; border-radius:99px; }
  #msg { position:fixed; left:12px; right:12px; top:calc(env(safe-area-inset-top,0px) + 52px); z-index:6; font-size:13px; padding:10px 12px; border-radius:12px; display:none; background:rgba(150,20,30,.92); white-space:pre-wrap; word-break:break-word; }
  #load { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; z-index:4; font-size:16px; color:#c4b5fd; pointer-events:none; text-align:center; padding:20px; }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div id="top"><b>Catu AI</b><span id="badge">Live2D</span></div>
<div id="load">Catu load ho rahi hai nya~ ... (thoda time lag sakta hai)</div>
<div id="msg"></div>
<div id="bottom">
  <div class="row">
    <button class="big" id="bHello">👋 Hello</button>
    <button class="big" id="bCry">😢 Cry</button>
  </div>
  <div class="row chips" id="chips"></div>
</div>

<script src="https://cubism.live2d.com/sdk-web/cubismcore/live2dcubismcore.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pixi.js@6.5.10/dist/browser/pixi.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pixi-live2d-display@0.4.0/dist/cubism4.min.js"></script>
<script>
(function () {
  const $ = (id) => document.getElementById(id);
  const msg = $('msg');
  function showErr(t) { msg.style.display = 'block'; msg.textContent = t; console.error(t); }
  window.addEventListener('error', (e) => showErr('Error: ' + e.message));
  window.addEventListener('unhandledrejection', (e) => showErr('Error: ' + (e.reason && e.reason.message || e.reason)));

  if (!window.Live2DCubismCore) { showErr('Live2D core load nahi hua (internet ya cubism.live2d.com block?).'); return; }
  if (!window.PIXI || !PIXI.live2d) { showErr('Pixi / pixi-live2d-display load nahi hua.'); return; }

  const MODEL_URL = 'catu.model3.json';
  const EXPRESSIONS = ['blush_heart','angry','dizzy','star_eyes','tears','hold_heart','begging','dot_eyes','monthly_card','squint'];
  let model = null, app = null, resetTimer = null;

  try { PIXI.settings.SPRITE_MAX_TEXTURES = Math.min(PIXI.settings.SPRITE_MAX_TEXTURES || 8, 16); } catch (e) {}
  try { PIXI.live2d.Live2DModel.registerTicker(PIXI.Ticker); } catch (e) {}

  app = new PIXI.Application({
    view: $('stage'),
    resizeTo: window,
    backgroundAlpha: 0,
    antialias: true,
    autoDensity: true,
    resolution: Math.min(window.devicePixelRatio || 1, 2),
    powerPreference: 'low-power'
  });

  function fit() {
    if (!model) return;
    const w = app.screen.width, h = app.screen.height;
    model.scale.set(1);
    const mw = model.width, mh = model.height;
    const s = Math.min((w * 0.95) / mw, (h * 0.68) / mh);
    model.scale.set(s);
    model.anchor.set(0.5, 0.5);
    model.x = w / 2;
    model.y = h * 0.47;
  }
  window.addEventListener('resize', fit);

  function resetExpr() {
    try { model.internalModel.motionManager.expressionManager.resetExpression(); } catch (e) {}
  }
  function setExpr(name) {
    try { resetExpr(); if (name) model.expression(name); } catch (e) { showErr('Expression error: ' + (e.message || e)); }
  }

  function speak(text, rate, pitch) {
    try {
      if (!('speechSynthesis' in window)) return;
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = 'hi-IN'; u.rate = rate || 1; u.pitch = pitch || 1.15;
      const v = speechSynthesis.getVoices().find(v => /hi[-_]IN/i.test(v.lang));
      if (v) u.voice = v;
      speechSynthesis.speak(u);
    } catch (e) {}
  }

  function play(group, expr, text, ms, rate, pitch) {
    if (!model) return;
    clearTimeout(resetTimer);
    setExpr(expr);
    speak(text, rate, pitch);
    const prio = (PIXI.live2d.MotionPriority && PIXI.live2d.MotionPriority.FORCE) || 3;
    Promise.resolve(model.motion(group, undefined, prio)).then((ok) => {
      if (ok === false) showErr('"' + group + '" motion nahi mili. GitHub par naya catu.model3.json aur motion files upload hui?');
    }).catch((e) => showErr('Motion error: ' + (e.message || e)));
    resetTimer = setTimeout(resetExpr, ms);
  }

  $('bHello').onclick = () => play('Hello', 'blush_heart', 'हेलो शुभम, कैसे हो?', 4700, 1, 1.2);
  $('bCry').onclick   = () => play('Cry', 'tears', 'मैं बहुत उदास हूँ शुभम', 6200, 0.85, 1.25);

  const chips = $('chips');
  EXPRESSIONS.forEach((n) => {
    const b = document.createElement('button');
    b.textContent = n.replace(/_/g, ' ');
    b.onclick = () => { clearTimeout(resetTimer); setExpr(n); };
    chips.appendChild(b);
  });
  const rb = document.createElement('button');
  rb.textContent = '↺ reset'; rb.onclick = () => { clearTimeout(resetTimer); resetExpr(); };
  chips.appendChild(rb);

  PIXI.live2d.Live2DModel.from(MODEL_URL, { autoInteract: false }).then((m) => {
    model = m;
    app.stage.addChild(model);
    fit();
    $('load').style.display = 'none';
  }).catch((e) => {
    $('load').style.display = 'none';
    showErr('Model load error: ' + (e && e.message || e));
  });
})();
</script>
</body>
</html>
